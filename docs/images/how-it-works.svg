<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" font-family="Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How DocuRead works</title>
  <desc id="d">A document goes to Claude, which returns each field with a confidence. Rule checks then test dates, money and totals. Fields that pass are accepted; anything doubtful goes to a human review queue.</desc>
  <rect width="1100" height="300" fill="#0e0d0b"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a09a89"/></marker>
  </defs>
  <g fill="#16150f" stroke="#3d392e" stroke-width="1.5">
    <rect x="30" y="100" width="170" height="100" rx="4"/>
    <rect x="260" y="100" width="190" height="100" rx="4"/>
    <rect x="510" y="100" width="210" height="100" rx="4"/>
    <rect x="800" y="40" width="270" height="90" rx="4" stroke="#3fb27f"/>
    <rect x="800" y="170" width="270" height="90" rx="4" stroke="#d9a441"/>
  </g>
  <g fill="#f3f0e6" font-size="17" font-weight="bold" text-anchor="middle">
    <text x="115" y="140">Document</text>
    <text x="355" y="140">Claude reads it</text>
    <text x="615" y="140">Rule checks</text>
    <text x="935" y="78" fill="#3fb27f">Accepted</text>
    <text x="935" y="208" fill="#d9a441">Review queue</text>
  </g>
  <g fill="#a09a89" font-size="13" text-anchor="middle">
    <text x="115" y="165">receipt · invoice</text>
    <text x="115" y="183">certificate (image/PDF)</text>
    <text x="355" y="165">value + confidence</text>
    <text x="355" y="183">for every field</text>
    <text x="615" y="165">real dates · money parses</text>
    <text x="615" y="183">totals add up · date order</text>
    <text x="935" y="102">confident and passes every check</text>
    <text x="935" y="232">unsure, failed a check, or missing</text>
    <text x="935" y="250">a person confirms or corrects it</text>
  </g>
  <g stroke="#a09a89" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M200 150 H255"/>
    <path d="M450 150 H505"/>
    <path d="M720 140 C760 140 760 85 795 85"/>
    <path d="M720 160 C760 160 760 215 795 215"/>
  </g>
</svg>
