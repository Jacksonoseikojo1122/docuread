# Runs the real eval against Claude. Costs money, so it only runs when you start it
# by hand (Actions -> Eval -> Run workflow) and needs an ANTHROPIC_API_KEY secret.
name: Eval
on:
  workflow_dispatch:
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval/REPORT.md
